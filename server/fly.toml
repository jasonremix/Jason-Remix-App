# Fly.io deployment.
#
#   fly launch --no-deploy --name jason-remix-api
#   fly volumes create jason_remix_data --size 1 --region fra
#   fly secrets set JWT_SECRET=… TOKEN_ENCRYPTION_KEY=… SPOTIFY_CLIENT_ID=… SPOTIFY_CLIENT_SECRET=…
#   fly deploy
#
# Secrets are set with `fly secrets`, never in this file — it is committed.

app = 'jason-remix-api'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '4000'
  DATABASE_URL = '/data/jason-remix.sqlite'

[[mounts]]
  source = 'jason_remix_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  # SQLite is a single file on a single volume, so exactly one machine may write
  # to it. Autoscaling this service would corrupt the ledger.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
